[project]
name = "vetglobal-backend"
version = "0.1.0"
description = "Asynchronous clinical document summarization API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "alembic>=1.14",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
# One event loop for the whole session. The SQLAlchemy engine is a module-level
# singleton, and a pooled asyncpg connection belongs to the loop that opened it:
# a loop per test would hand test B a connection attached to test A's dead loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.uv]
package = false
